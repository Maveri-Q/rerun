# The Lab on Phala Cloud (dstack CVM). This file's sha256 is the Lab's codehash: the hardware quote
# commits to it, and the owner registers it on NEAR. So every image is pinned by digest here, never by an
# environment variable, and only settings that can't change what the code does come from secrets.
# Digests from the Images workflow, run #1 on commit e18100e. Deploy steps: docs/PHALA.md.
services:
  lab:
    image: ghcr.io/maveri-q/rerun-lab@sha256:8b364b046815c323c775ff524bd75c0db291b10cdf2630ca5fdc2470aa725484
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # The guest agent: keys that only this code can derive, and quotes over the Lab's public keys.
      - /var/run/dstack.sock:/var/run/dstack.sock
      # The CVM's own Docker, to start one sandbox container per run, network off while research code runs.
      - /var/run/docker.sock:/var/run/docker.sock
      - lab-data:/app/lab/orchestrator/.data
    environment:
      NEAR_NETWORK: testnet
      SANDBOX_IMAGE_PYTHON: ghcr.io/maveri-q/rerun-sandbox-python@sha256:8ecd9bc04a83addb6acc1b45ee0b2854eddbde692c914576b8290172680c584c
      SANDBOX_IMAGE_R: ghcr.io/maveri-q/rerun-sandbox-r@sha256:d97bec581cc8d27f3f1cfe9a5a1d7d2598949f2660fe9572a7955fa5ed74a409
      TEE_CREATE_ACCOUNT: "1"
      # The machine has 2 vCPUs and 4 GB: leave 1 GB for the Lab and Docker.
      SANDBOX_MAX_CPUS: "2"
      SANDBOX_MAX_MEM_GB: "3"
      # Encrypted secrets, set in the Phala dashboard:
      TEE_LAB_ACCOUNT: ${TEE_LAB_ACCOUNT}
      TESTNET_CONTRACT_ACCOUNT: ${TESTNET_CONTRACT_ACCOUNT}
      NEARAI_CLOUD_API_KEY: ${NEARAI_CLOUD_API_KEY}
      LAB_PUBLIC_URL: ${LAB_PUBLIC_URL}
      # Testnet only, for the hourly demo claims: the owner key that posts them. Leave empty to turn them off.
      ROLLING_DEMOS: ${ROLLING_DEMOS}
      TESTNET_OWNER_ACCOUNT: ${TESTNET_OWNER_ACCOUNT}
      TESTNET_OWNER_PRIVATE_KEY: ${TESTNET_OWNER_PRIVATE_KEY}

volumes:
  lab-data:
